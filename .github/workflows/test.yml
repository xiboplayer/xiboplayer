name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'  # nightly at 03:17 UTC
  workflow_dispatch:

jobs:
  unit:
    uses: xiboplayer/.github/.github/workflows/test.yml@86264d87f5dd3758fddd9dcc60bbf963213d312f  # main
    with:
      lint-command: 'pnpm lint'
      typecheck: true

  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: unit
    uses: xiboplayer/.github/.github/workflows/integration-test.yml@86264d87f5dd3758fddd9dcc60bbf963213d312f  # main
    with:
      # Runs against the self-contained CMS in docker-compose.test.yml.
      # Pointing this at xibo-dev.superpantalles.com made the job fail with
      # ENOTFOUND: that host has no public DNS record or ingress.
      cms-url: ''
    secrets:
      CMS_CLIENT_ID: ${{ secrets.CMS_CLIENT_ID }}
      CMS_CLIENT_SECRET: ${{ secrets.CMS_CLIENT_SECRET }}
