name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: >-
          Safe smoke test: run the build and `pnpm -r publish --dry-run`
          only. npm skips the registry auth call on --dry-run, so this
          does NOT exercise the OIDC trusted-publishing exchange — it only
          proves checkout/permissions/build/environment resolution. Leave
          true unless you are deliberately doing a real verification
          publish (dispatch with dry-run=false against an unbumped ref to
          get a harmless "cannot publish over existing version" once auth
          succeeds, or against a throwaway prerelease version+dist-tag for
          a full round trip).
        type: boolean
        default: true

# `contents: write` is needed by the release job below (gh release create).
# `id-token: write` is required for npm trusted publishing (OIDC exchange
# handled by the shared publish-npm.yml workflow) — this is the ONLY
# auth path for this job (see the `publish` job below: no `secrets:` is
# passed, so the reusable workflow's optional NPM_TOKEN fallback can never
# fire from this repo).
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # npm's trusted-publisher validation checks the CALLER workflow's repo
    # + filename (this file, xiboplayer/xiboplayer/.github/workflows/publish.yml)
    # and the `environment` below — NOT the reusable workflow file that
    # actually runs `pnpm publish`. Configure each @xiboplayer/* package's
    # npm trusted publisher as:
    #   Repository: xiboplayer/xiboplayer
    #   Workflow filename: publish.yml
    #   Environment: npm-publish
    uses: xiboplayer/.github/.github/workflows/publish-npm.yml@9af382cf12830bca426a1a99e4b59532ee72a711  # main
    with:
      environment: 'npm-publish'
      # Registry writes go through a standalone `npm publish` per package,
      # not `pnpm -r publish` directly: pnpm's own publish spawns a real
      # `npm publish` but does not reach npm's OIDC trusted-publishing
      # exchange (reproduced independently: github.com/pnpm/pnpm#9812,
      # comment 2026-01-14 — same Node/npm versions, `pnpm publish` never
      # completes OIDC while a standalone `npm publish` in the same job
      # does). `pnpm pack` still does the one thing raw npm can't: rewrite
      # `workspace:*` cross-package deps (@xiboplayer/core, /sw, /renderer,
      # ...) to real semver before the tarball is built, so it stays in
      # the loop for that. npm is pinned to the 11.x line, never `@latest`
      # — 11.19.0 already clears the >=11.5.1 OIDC floor and is the major
      # verified against OIDC upstream; an unpinned same-day major is an
      # untested variable this path doesn't need. The dist-tag is derived
      # from the version being published (a prerelease, e.g. 0.7.24-x.0,
      # goes out under its own tag, never `latest` — npm's default tag is
      # always `latest` regardless of prerelease status unless told
      # otherwise, so this has to be explicit).
      publish-command: |
        npm install -g npm@'^11'
        npm --version
        pnpm --filter @xiboplayer/pwa build
        PKG_VERSION="$(node -p "require('./packages/utils/package.json').version")"
        case "$PKG_VERSION" in
          *-*) DIST_TAG="$(node -p "'$PKG_VERSION'.split('-')[1].split('.')[0]")" ;;
          *) DIST_TAG="latest" ;;
        esac
        echo "Publishing $PKG_VERSION under dist-tag $DIST_TAG"
        pnpm -r publish --no-git-checks --access public --tag "$DIST_TAG" --dry-run --report-summary
        DRY="${{ inputs.dry-run && '--dry-run' || '' }}"
        PACK_DIR="$(mktemp -d)"
        node -e "for (const p of require('./pnpm-publish-summary.json').publishedPackages) console.log(p.name)" > "$PACK_DIR/queue.txt"
        while IFS= read -r NAME; do
          [ -z "$NAME" ] && continue
          echo "::group::Publishing $NAME (standalone npm, no pnpm in the process tree)"
          pnpm --filter "$NAME" pack --pack-destination "$PACK_DIR"
          TARBALL="$(ls -t "$PACK_DIR"/xiboplayer-*.tgz | head -1)"
          ( cd "$PACK_DIR" && npm publish "$(basename "$TARBALL")" --tag "$DIST_TAG" --provenance --access public $DRY )
          rm -f "$TARBALL"
          echo "::endgroup::"
        done < "$PACK_DIR/queue.txt"
    # No `secrets: inherit`, on purpose. The reusable workflow's NPM_TOKEN
    # input is optional and, if set, bypasses OIDC with a static token —
    # exactly the masking behavior we don't want. Omitting `secrets:`
    # means NPM_TOKEN is never forwarded from this repo, so a trusted-
    # publisher misconfiguration fails the job loudly (ENEEDAUTH / 404)
    # instead of silently succeeding on a stored token.
    #
    # Was needed historically because the npm trusted-publisher entries
    # for these packages still named the pre-rename org
    # (xibo-players/xiboplayer) — see the "Repository:" line in the
    # `publish` job comment above for the corrected entry every package
    # needs. Do not reintroduce `secrets: inherit` as a workaround; fix
    # the trusted-publisher entries on npmjs.com instead.

  # Create a GitHub Release for every tagged SDK bump. Needed so
  # `list_releases` and other tooling can see the SDK's published
  # versions — npm alone doesn't surface in the GH UI / API.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    uses: xiboplayer/.github/.github/workflows/create-release.yml@9af382cf12830bca426a1a99e4b59532ee72a711  # main
    with:
      package-name: 'xiboplayer-sdk'
      description: 'xiboplayer SDK monorepo — @xiboplayer/* npm packages published together at matching versions.'
      install-url: 'https://www.npmjs.com/org/xiboplayer'
      install-snippet: |
        All `@xiboplayer/*` packages are published at the same version. Install any of them with:

        ```bash
        # pnpm
        pnpm add @xiboplayer/pwa

        # npm
        npm install @xiboplayer/pwa
        ```

        Full list: `@xiboplayer/{core,cache,proxy,renderer,stats,utils,pwa,xmds,xmr,sw,settings,sync,schedule,layout-runtime,timeline,widget-host}`.

  # Generate a CycloneDX SBOM for the tagged release and attach it to the
  # GitHub Release. Framed as "software inventory for transparency", not
  # a CRA compliance claim (see xiboplayer-compliance/cra/ RFC-0001).
  # Downstream commercial redistributors need it for their own work.
  sbom:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: xiboplayer-sdk-sbom.cdx.json

      - name: Upload SBOM to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" xiboplayer-sdk-sbom.cdx.json --clobber

  dispatch-www:
    name: Trigger xiboplayer-www regeneration
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to xiboplayer-www
        env:
          GH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WWW_DISPATCH_TOKEN not set — skipping www regen trigger."
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(npm view @xiboplayer/pwa version 2>/dev/null || echo 'unknown')
          fi
          echo "Firing repository_dispatch sdk-published to xiboplayer-www with version=$VER"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/xiboplayer/xiboplayer-www/dispatches \
            -f event_type=sdk-published \
            -f "client_payload[version]=${VER}" \
            -f "client_payload[source]=xiboplayer-sdk" \
            -f "client_payload[tag]=${GITHUB_REF}"
          echo "Dispatch fired"
